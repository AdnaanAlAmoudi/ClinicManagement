<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Hospital Management System</h2>
      <p>Please select your role and login</p>
    </div>

    <div class="role-selector">
      <button type="button"
              class="role-btn"
              [class.active]="selectedRole === userRoles.Admin"
              (click)="onRoleChange(userRoles.Admin)">
        <i class="fas fa-user-shield"></i>
        Admin
      </button>
      <button type="button"
              class="role-btn"
              [class.active]="selectedRole === userRoles.Doctor"
              (click)="onRoleChange(userRoles.Doctor)">
        <i class="fas fa-stethoscope"></i>
        Doctor
      </button>
      <button type="button"
              class="role-btn"
              [class.active]="selectedRole === userRoles.Receptionist"
              (click)="onRoleChange(userRoles.Receptionist)">
        <i class="fas fa-desk"></i>
        Receptionist
      </button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text"
               id="username"
               formControlName="username"
               class="form-control"
               [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        <div class="error-message" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password"
               id="password"
               formControlName="password"
               class="form-control"
               [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required
        </div>
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit"
              class="login-btn"
              [disabled]="loginForm.invalid || loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Signing in...' : 'Sign in as ' + getRoleText(selectedRole) }}
      </button>
    </form>
  </div>
</div>
